# =====================================================================
# 1. FRONTEND & API LAYER (Open WebUI API Pods)
# =====================================================================
api:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "main"
    pullPolicy: IfNotPresent

  # Default to 3 replicas for HA (scaling up to 10 via HPA)
  replicaCount: 1

  # Secret key for cookie signing. If empty, a random key will be generated in secrets.yaml
  webuiSecretKey: ""

  # Persistence settings if local SQLite or local configs are needed
  # making the API pods stateless.
  persistence:
    enabled: false
    size: 2Gi
    storageClass: "managed-csi"

  # Additional Environment variables
  extraEnv:
    - name: ENABLE_OTEL_METRICS
      value: "True"
    - name: OTEL_SERVICE_NAME
      value: "open-webui"
    - name: OTEL_METRICS_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector.monitoring.svc.cluster.local:4317"
    - name: OTEL_METRICS_EXPORTER_OTLP_INSECURE
      value: "True"
    - name: OTEL_METRICS_OTLP_SPAN_EXPORTER
      value: "grpc"
    - name: OTEL_METRICS_EXPORT_INTERVAL_MILLIS
      value: "15000"
    # existing vars below
    - name: ENABLE_PERSISTENT_CONFIG
      value: "False"
    - name: ENABLE_DB_MIGRATIONS
      value: "True"
    - name: STORAGE_PROVIDER
      value: "azure"

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/websocket-services: "open-webui-api"
    hosts:
      - host: "openwebui.20.221.57.224.nip.io"
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Autoscaling (HPA)
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget
  pdb:
    enabled: true
    maxUnavailable: 1

  # Pod distribution policies
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - open-webui-production
            topologyKey: kubernetes.io/hostname

  nodeSelector: {}
  tolerations: []

# =====================================================================
# 2. STATEFUL DATA LAYER (Databases)
# =====================================================================

# PostgreSQL (Using CloudNativePG Operator)
postgres:
  cnpg:
    enabled: true
    instances: 1
    monitoring:
      enablePodMonitor: false
    storage:
      size: 10Gi
      storageClass: "managed-csi"
    walStorage:
      size: 5Gi
      storageClass: "managed-csi"
  
# Configuration when postgres.cnpg.enabled is false (connecting to an external PG database)
  external:
    enabled: false
    url: "postgresql://user:password@external-pg-host:5432/openwebui"

# Redis Sentinel (Session & WebSockets coordination)
redis:
  enabled: true
  replicas: 1
  sentinel:
    enabled: true
    masterName: mymaster
  storage:
    size: 5Gi
    storageClass: "managed-csi"
  
  # Connect to an external Redis cluster
  external:
    enabled: false
    url: "redis://:password@external-redis:6379/0"

# Qdrant (Semantic Search & RAG Embeddings)
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: v1.9.0
    pullPolicy: IfNotPresent
  storage:
    size: 10Gi
    storageClass: "managed-csi"
  
# Connect to an external Qdrant instance
  external:
    enabled: false
    url: "http://external-qdrant:6333"

# MinIO (Shared object storage for PDFs/Images/Uploads)
minio:
  enabled: false
  image:
    repository: minio/minio
    tag: RELEASE.2024-05-10T01-39-18Z
    pullPolicy: IfNotPresent
  accessKey: "admin"
  secretKey: "supersecretadminpass"
  bucketName: "open-webui"
  storage:
    size: 20Gi
    storageClass: ""
  
# Connect to external S3 storage
external:
  enabled: false
  endpoint: "https://s3.amazonaws.com"
  accessKey: ""
  secretKey: ""
  bucketName: ""
  region: "us-east-1"

# Connect to external blob storage
azure:
  enabled: true
  storageEndpoint: "https://openwebui01.blob.core.windows.net"  
  storageKey: ""
  storageContainer: "openwebui" 
# =====================================================================
# 3. MODEL INFERENCE & ROUTING LAYER
# =====================================================================

# LiteLLM Inference Gateway
gateway:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  
  # LiteLLM Master API Key
  masterKey: "sk-litellm-master-key-12345"
  
  # Models configuration maps LiteLLM router paths to LLM engines
  config: |
    model_list:
      - model_name: llama-3.1-70b
        litellm_params:
          model: openai/meta/llama-3.1-70b-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: "os.environ/NVIDIA_API_KEY"

      - model_name: llama-3.1-8b
        litellm_params:
          model: openai/meta/llama-3.1-8b-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: "os.environ/NVIDIA_API_KEY"

      - model_name: mistral-7b
        litellm_params:
          model: openai/mistralai/mistral-7b-instruct-v0.3
          api_base: https://integrate.api.nvidia.com/v1
          api_key: "os.environ/NVIDIA_API_KEY"

      - model_name: gemma-2-27b
        litellm_params:
          model: openai/google/gemma-2-27b-it
          api_base: https://integrate.api.nvidia.com/v1
          api_key: "os.environ/NVIDIA_API_KEY"
  
  # Environment secrets for third-party LLMs (e.g. OpenAI/Anthropic keys)
  openaiApiKey: ""
  anthropicApiKey: ""
  nvidiaApiKey: ""

# vLLM Engine (GPU Cluster)
vllm:
  enabled: false
  image:
    repository: vllm/vllm-openai
    tag: latest
    pullPolicy: IfNotPresent
  modelName: "mistralai/Mistral-7B-Instruct-v0.2"
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: "500Mi"
      cpu: "500Mi"
      memory: "1Gi"
    requests:
      nvidia.com/gpu: "500Mi"
      cpu: "500Mi"
      memory: "1Gi"
  nodeSelector:
    cloud.google.com/gke-gpu-pool: "gpu-pool-a"
  tolerations:
    - key: "sku"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"

# Ollama Engine
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  storage:
    size: 50Gi
    storageClass: ""
  nodeSelector:
    cloud.google.com/gke-gpu-pool: "gpu-pool-b"
  tolerations:
    - key: "sku"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"

# =====================================================================
# 4. SUPPORTING K8S CONFIGURATION
# =====================================================================
networkPolicies:
  enabled: true

observability:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
