---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-webhook
  namespace: owui-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-webhook-role
  namespace: owui-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]   # Step 7: added events
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-webhook-rolebinding
  namespace: owui-app
subjects:
  - kind: ServiceAccount
    name: ai-webhook
    namespace: owui-app
roleRef:
  kind: Role
  name: ai-webhook-role
  apiGroup: rbac.authorization.k8s.io

# Step 1: Secret manifest REMOVED — created by Jenkins at deploy time

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-webhook
  namespace: owui-app
  labels:
    app: ai-webhook
spec:
  replicas: 2                        # Step 4: HA — two instances
  selector:
    matchLabels:
      app: ai-webhook
  template:
    metadata:
      labels:
        app: ai-webhook
    spec:
      serviceAccountName: ai-webhook
      volumes:
        - name: argocd-tls            # Step 8: mount ArgoCD CA cert
          secret:
            secretName: argocd-secret
            items:
              - key: tls.crt
                path: tls.crt
      containers:
        - name: ai-webhook
          image: <your-registry>/ai-webhook:latest
          imagePullPolicy: Always
          ports:
            - name: http              # Step 9: named port
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http              # Step 9: by name
            initialDelaySeconds: 10
            periodSeconds: 15         # Step 3: was 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:             # Step 3: added
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          volumeMounts:
            - name: argocd-tls        # Step 8
              mountPath: /etc/argocd-tls
              readOnly: true
          env:
            - name: ARGOCD_SERVER
              value: "argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_APP_NAME
              value: "open-webui"
            - name: K8S_NAMESPACE
              value: "owui-app"       # Step 5: was "open-webui"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: ALERT_EMAIL_FROM
              value: "alerts@yourdomain.com"
            - name: ARGOCD_TLS_CERT
              value: "/etc/argocd-tls/tls.crt"   # Step 8
          envFrom:
            - secretRef:
                name: ai-webhook-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-webhook
  namespace: owui-app               # Step 2: was "owui -app" (typo fixed)
spec:
  selector:
    app: ai-webhook
  ports:
    - name: http                    # Step 9: named port
      port: 8000
      targetPort: http
  type: ClusterIP

---
apiVersion: policy/v1              # Step 4: added PDB
kind: PodDisruptionBudget
metadata:
  name: ai-webhook-pdb
  namespace: owui-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-webhook
