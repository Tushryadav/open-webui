---
# ServiceAccount with permission to read pods/logs in open-webui namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-webhook
  namespace: owui-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-webhook-role
  namespace: owui-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-webhook-rolebinding
  namespace: owui-app 
subjects:
  - kind: ServiceAccount
    name: ai-webhook
    namespace: owui-app 
roleRef:
  kind: Role
  name: ai-webhook-role
  apiGroup: rbac.authorization.k8s.io

---
# Secret holding all sensitive config
apiVersion: v1
kind: Secret
metadata:
  name: ai-webhook-secrets
  namespace: owui-app 
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""          # ← your Claude API key
  ARGOCD_TOKEN: ""                       # ← ArgoCD API token (Settings > Accounts)
  SMTP_USER: ""
  SMTP_PASSWORD: ""        # Gmail App Password
  ALERT_EMAIL_TO: ""

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-webhook
  namespace: owui-app
  labels:
    app: ai-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-webhook
  template:
    metadata:
      labels:
        app: ai-webhook
    spec:
      serviceAccountName: ai-webhook
      containers:
        - name: ai-webhook
          image: <your-registry>/ai-webhook:latest   # ← push your built image here
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3      # restart after 3 consecutive failures (45s total)
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5   # FastAPI starts fast — 5s is enough
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
          env:
            - name: ARGOCD_SERVER
              value: "argocd-server.argocd.svc.cluster.local"
            - name: ARGOCD_APP_NAME
              value: "open-webui"
            - name: K8S_NAMESPACE
              value: "open-webui"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: ALERT_EMAIL_FROM
              value: "alerts@yourdomain.com"
          envFrom:
            - secretRef:
                name: ai-webhook-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
# ClusterIP service — reachable by Alertmanager inside cluster
apiVersion: v1
kind: Service
metadata:
  name: ai-webhook
  namespace: owui-app
spec:
  selector:
    app: ai-webhook
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

# addded Pod disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-webhook-pdb
  namespace: owui-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-webhook
