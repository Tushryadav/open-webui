{{- if .Values.vllm.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  replicas: {{ .Values.vllm.replicas }}
  selector:
    matchLabels:
      {{- include "open-webui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vllm
  template:
    metadata:
      labels:
        {{- include "open-webui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vllm
    spec:
      {{- if .Values.vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.vllm.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml .Values.vllm.tolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          imagePullPolicy: {{ .Values.vllm.image.pullPolicy }}
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - {{ .Values.vllm.modelName | quote }}
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
{{- end }}
