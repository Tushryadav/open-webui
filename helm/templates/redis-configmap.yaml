{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-redis-config
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
data:
  redis.conf: |
    port 6379
    dir /data
    protected-mode no
    # Replication configuration will be added at runtime by the entrypoint script

  sentinel.conf: |
    port 26379
    dir /data
    protected-mode no
    sentinel monitor {{ .Values.redis.sentinel.masterName }} {{ .Release.Name }}-redis-0.{{ .Release.Name }}-redis-headless 6379 {{ .Values.redis.sentinel.quorum }}
    sentinel down-after-milliseconds {{ .Values.redis.sentinel.masterName }} 5000
    sentinel failover-timeout {{ .Values.redis.sentinel.masterName }} 60000
    sentinel parallel-syncs {{ .Values.redis.sentinel.masterName }} 1
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

  init.sh: |
    #!/bin/sh
    set -e
    
    # Identify pod index
    POD_INDEX=$(echo "$HOSTNAME" | grep -o '[0-9]*$')
    echo "Initializing Redis Pod Index: $POD_INDEX"
    
    # Copy base configuration
    cp /readonly-config/redis.conf /data/redis.conf
    cp /readonly-config/sentinel.conf /data/sentinel.conf
    
    if [ "$POD_INDEX" -ne "0" ]; then
      # Make replicas point to pod 0 initially
      echo "replicaof {{ .Release.Name }}-redis-0.{{ .Release.Name }}-redis-headless 6379" >> /data/redis.conf
    fi
    
    echo "Initialization complete."
{{- end }}
