{{- if .Values.networkPolicies.enabled -}}
# ---------------------------------------------------------------------
# 1. API Pods NetworkPolicy
# ---------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-webui.fullname" . }}-api-policy
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-webui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from external/ingress-controllers to Open WebUI port 8080
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow outgoing traffic to anywhere (Internet APIs, DNS, local DB services)
    - {}
---
# ---------------------------------------------------------------------
# 2. Stateful Services (DBs) NetworkPolicy
# ---------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-webui.fullname" . }}-db-policy
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      # Targets postgres, redis, qdrant, minio pods
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Only allow connections originating from the API pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "open-webui.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 5432   # PG
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 26379  # Sentinel
        - protocol: TCP
          port: 6333   # Qdrant HTTP
        - protocol: TCP
          port: 6334   # Qdrant gRPC
        - protocol: TCP
          port: 9000   # MinIO API
        - protocol: TCP
          port: 9001   # MinIO Console
---
# ---------------------------------------------------------------------
# 3. Inference Layer Isolation Policy
# ---------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-webui.fullname" . }}-inference-policy
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Allow LiteLLM gateway to communicate with vLLM and Ollama
    - from:
        - podSelector:
            matchLabels:
              {{- include "open-webui.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: inference-gateway
      ports:
        - protocol: TCP
          port: 8000   # vLLM
        - protocol: TCP
          port: 11434  # Ollama
{{- end }}
