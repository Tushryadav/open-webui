apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-webui.fullname" . }}-secrets
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
type: Opaque
data:
  # Base Open WebUI security key
  webui-secret-key: {{ default (randAlphaNum 32) .Values.api.webuiSecretKey | b64enc | quote }}

  # MinIO credentials
  minio-access-key: {{ .Values.minio.accessKey | b64enc | quote }}
  minio-secret-key: {{ .Values.minio.secretKey | b64enc | quote }}

  # External services credentials (used if enabled)
  {{- if .Values.postgres.external.enabled }}
  external-postgres-url: {{ .Values.postgres.external.url | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.external.enabled }}
  external-redis-url: {{ .Values.redis.external.url | b64enc | quote }}
  {{- end }}
  {{- if .Values.qdrant.external.enabled }}
  external-qdrant-url: {{ .Values.qdrant.external.url | b64enc | quote }}
  {{- end }}
  {{- if .Values.minio.external.enabled }}
  external-s3-access-key: {{ .Values.minio.external.accessKey | b64enc | quote }}
  external-s3-secret-key: {{ .Values.minio.external.secretKey | b64enc | quote }}
  {{- end }}

  # LiteLLM external provider API keys
  nvidia-api-key: {{ .Values.gateway.nvidiaApiKey | b64enc | quote }}
  openai-api-key: {{ .Values.gateway.openaiApiKey | b64enc | quote }}
  anthropic-api-key: {{ .Values.gateway.anthropicApiKey | b64enc | quote }}
