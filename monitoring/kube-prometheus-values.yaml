# ── Prometheus ────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "10GB"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Watch ServiceMonitors across ALL namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

# ── Grafana ───────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "change-me-strong-password"    # CHANGE THIS
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    hosts:
      - grafana.<YOUR-IP>.nip.io               # CHANGE THIS
    tls: []
  # Pre-load community dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: Open WebUI Stack
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 15757
        revision: 37
        datasource: Prometheus
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus
      redis:
        gnetId: 11835
        revision: 1
        datasource: Prometheus
      postgres:
        gnetId: 9628
        revision: 7
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

# ── AlertManager ──────────────────────────────────────────────────────
alertmanager:
  enabled: true
  config:
    receivers:
      - name: ai-webhook
        webhook_configs:
          - url: "http://ai-webhook.owui-app.svc.cluster.local:8000/alert"
            send_resolved: false
    route:
      receiver: ai-webhook
      group_by: ["alertname", "app"]
      group_wait: 30s
      repeat_interval: 1h
      routes:
        - matchers:
            - severity = critical
            - app = open-webui
          receiver: ai-webhook
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# ── kube-state-metrics ────────────────────────────────────────────────
kube-state-metrics:
  enabled: true

# ── node-exporter ─────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ── Prometheus Operator ───────────────────────────────────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
