apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: owui-alerts
  namespace: monitoring
spec:
  route:
    receiver: default
    groupBy: ['namespace', 'alertname']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    routes:
      - matchers:
          - name: severity
            value: critical
          - name: app
            value: open-webui
        receiver: ai-webhook-receiver
        groupWait: 10s
      - matchers:
          - name: severity
            value: warning
        receiver: email-only

  receivers:
    - name: default
      emailConfigs:
        - to: your@email.com                   # CHANGE THIS
          from: alerts@yourdomain.com
          smarthost: smtp.gmail.com:587
          authUsername: your@gmail.com
          authPassword: your-app-password

    - name: ai-webhook-receiver
      webhookConfigs:
        - url: http://ai-webhook.open-webui.svc.cluster.local:8000/alert
          sendResolved: true
          httpConfig:
            tlsConfig:
              insecureSkipVerify: true

    - name: critical
      emailConfigs:
        - to: your@email.com
          from: alerts@yourdomain.com
          smarthost: smtp.gmail.com:587
          authUsername: your@gmail.com
          authPassword: your-app-password

    - name: warning
      emailConfigs:
        - to: your@email.com
          from: alerts@yourdomain.com
          smarthost: smtp.gmail.com:587
          authUsername: your@gmail.com
          authPassword: your-app-password
