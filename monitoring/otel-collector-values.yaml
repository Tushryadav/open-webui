mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.105.0"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317    # Open WebUI pushes here
        http:
          endpoint: 0.0.0.0:4318

    # Scrape Redis exporter
    prometheus:
      config:
        scrape_configs:
          - job_name: redis
            static_configs:
              - targets:
                  - owui-data-redis-exporter.owui-data.svc.cluster.local:9121
          - job_name: qdrant
            static_configs:
              - targets:
                  - owui-data-qdrant.owui-data.svc.cluster.local:6333
            metrics_path: /metrics

  processors:
    batch:
      timeout: 10s
      send_batch_size: 1000
    memory_limiter:
      limit_mib: 400
      spike_limit_mib: 100
      check_interval: 5s
    resource:
      attributes:
        - key: environment
          value: production
          action: upsert

  exporters:
    prometheus:
      endpoint: "0.0.0.0:8889"     # Prometheus scrapes this
      namespace: owui

  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch, resource]
        exporters: [prometheus]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP 